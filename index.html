<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Montserrat: the core identity, needed on the cover — load blocking -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Cormorant + Inter: only used on /v1 and /tvbs — load non-blocking -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet" media="print" onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Preload the cover hero so the first paint has its image ready -->
    <link rel="preload" as="image" href="/assets/images/las-conchas-aerea.webp" />

    <title>Las Conchas · Marbella</title>

    <!-- Open Graph -->
    <meta property="og:title" content="Las Conchas · Marbella" />
    <meta property="og:description" content="24 residencias exclusivas frente al mar en Marbella. Descubre tu hogar en la Costa del Sol." />
    <meta property="og:image" content="https://demo.thevisualsboutique.com/assets/images/las-conchas-aerea.webp" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://demo.thevisualsboutique.com/" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Las Conchas" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Las Conchas · Marbella" />
    <meta name="twitter:description" content="24 residencias exclusivas frente al mar en Marbella." />
    <meta name="twitter:image" content="https://demo.thevisualsboutique.com/assets/images/las-conchas-aerea.webp" />

    <!-- General meta -->
    <meta name="description" content="Las Conchas — 24 residencias exclusivas frente al mar en Marbella. Descubre tu hogar en la Costa del Sol." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
